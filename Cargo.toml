[workspace]
members = ["crates/sqlparser", "crates/core-parse", "crates/client", "crates/cli", "crates/mcp"]
resolver = "2"

[workspace.package]
version = "0.5.5"
edition = "2021"
authors = ["Ori Fisher"]
license = "Apache-2.0"

[workspace.dependencies]
sqlparser = { package = "varq-sqlparser", path = "crates/sqlparser" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
ureq = "3"
# At least 3.7: the server names `ServerConfig`, which 3.1.4 lacks. The public tree keeps its own
# lockfile across syncs, and it only moves a dependency forward when the manifest asks for it.
rmcp = { version = "3.7", features = ["server", "transport-io", "macros"] }
schemars = "1"
tokio = { version = "1", features = ["full"] }
roxmltree = "0.21"
