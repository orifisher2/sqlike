# The clients version on their own line, shared with the npm packages and the `cli-v*` /
# `mcp-v*` tags. They ship far less often than the engine deploys, so inheriting the
# workspace version would make every backend tag imply a ten-package npm republish.
[package]
name = "varq-cli"
version = "0.2.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "sqlike"
path = "src/main.rs"

# `local` (the offline engine) needs the closed analysis core, which is not part of this public
# repo; the distributable client is remote-only. Declared so the feature-gated code has a home;
# it is not built by default and cannot be enabled here.
[features]
local = []

[dependencies]
varq-core-parse = { path = "../core-parse" }
varq-client = { path = "../client" }
anyhow = { workspace = true }
clap = { workspace = true }
owo-colors = { workspace = true, features = ["supports-colors"] }
