# The clients version on their own line, shared with the npm packages and the `cli-v*` /
# `mcp-v*` tags. They ship far less often than the engine deploys, so inheriting the
# workspace version would make every backend tag imply a ten-package npm republish.
[package]
name = "varq-client"
version = "0.2.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# Engine-free: the client links only `core-parse` (parser + tokenizer + result types), never the
# analysis engine. It tokenizes locally, calls the server, detokenizes.
[dependencies]
varq-core-parse = { path = "../core-parse" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }
