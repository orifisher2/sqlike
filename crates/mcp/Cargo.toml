# The clients version on their own line, shared with the npm packages and the `cli-v*` /
# `mcp-v*` tags. They ship far less often than the engine deploys, so inheriting the
# workspace version would make every backend tag imply a ten-package npm republish.
[package]
name = "varq-mcp"
version = "0.2.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "sqlike-mcp"
path = "src/main.rs"

# Engine-free forwarder: links only `core-parse` (for the `Dialect` type) and the client; it
# carries no analysis engine and builds standalone.
[dependencies]
varq-core-parse = { path = "../core-parse" }
varq-client = { path = "../client" }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
